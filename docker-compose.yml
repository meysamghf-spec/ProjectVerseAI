services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: projectverse
      POSTGRES_PASSWORD: projectverse
      POSTGRES_DB: projectverse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projectverse -d projectverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      AUTH_MODE: development
      DEV_OWNER_ID: dev-user
      DATABASE_URL: postgresql+psycopg://projectverse:projectverse@db:5432/projectverse
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: deterministic
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
