# Self-hosted production overlay. Do not put a real API key in this file.
# Usage is documented in DEPLOYMENT.md.
services:
  db:
    ports: !reset []

  backend:
    environment:
      APP_ENV: production
      AUTH_MODE: api_key
      API_KEY: ${API_KEY:?Set API_KEY to a long random value}
      API_OWNER_ID: ${API_OWNER_ID:-hosted-owner}
      DATABASE_URL: postgresql+psycopg://projectverse:projectverse@db:5432/projectverse
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the public site origin}
      LLM_PROVIDER: deterministic

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public API origin}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL to the public API origin}
